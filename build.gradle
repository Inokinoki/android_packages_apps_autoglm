plugins {
    id 'com.android.application'
}

android {
    namespace 'org.lineageos.setupwizard'
    compileSdk 34

    defaultConfig {
        applicationId "org.lineageos.setupwizard"
        minSdk 29
        targetSdk 34
        versionCode 5
        versionName "1.0"
        
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            aidl.srcDirs = ['src']
            assets.srcDirs = ['assets']
        }
    }

    externalNativeBuild {
        cmake {
            path "src/jni/CMakeLists.txt"
            version "3.10.2"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.flags'
            signingConfig signingConfigs.debug
        }
    }
    
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.preference:preference:1.2.1'
    
    // LineageOS and System dependencies would typically be provided by the build system (Soong).
    // For a standalone Gradle build, these would need to be provided as local jars.
    // compileOnly files('libs/lineage-sdk.jar')
    // compileOnly files('libs/framework.jar')
}
